apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mealops-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mayadubinsky/MealOps.git
    targetRevision: main
    path: kubernetes/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: mealops-prod

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true