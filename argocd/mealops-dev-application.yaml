apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mealops-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mayadubinsky/MealOps.git
    targetRevision: BRANCH_PLACEHOLDER
    path: kubernetes/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: mealops-dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true