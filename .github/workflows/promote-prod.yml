name: Promote image to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag / commit SHA to promote to production"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check image tag exists in ACR
        shell: bash
        run: |
          TAG_EXISTS=$(az acr repository show-tags \
          --name mealopsacr12345 \
          --repository mealops \
          --query "contains(@, '${{ inputs.image_tag }}')" \
          -o tsv)

          if [ "$TAG_EXISTS" != "true" ]; then
          echo "Image tag '${{ inputs.image_tag }}' does not exist in ACR."
          exit 1
          fi
  
          echo "Image tag '${{ inputs.image_tag }}' exists in ACR."
  
      - name: Update production image tag
        run: |
          cd kubernetes/overlays/prod
          kustomize edit set image mealops=mealopsacr12345.azurecr.io/mealops:${{ inputs.image_tag }}

      - name: Commit production image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/prod/kustomization.yaml
          git commit -m "Promote image ${{ inputs.image_tag }} to production"
          git push

