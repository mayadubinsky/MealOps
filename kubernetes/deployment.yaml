apiVersion: apps/v1
kind: Deployment

metadata:
  name: mealops
  labels:
    app.kubernetes.io/name: mealops
    app.kubernetes.io/component: application

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mealops

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealops
        app.kubernetes.io/component: application

    spec:
      containers:
        - name: mealops
          image: mealopsacr12345.azurecr.io/mealops:v1
          imagePullPolicy: IfNotPresent

          env: 
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mealops-ai-secret
                  key: GEMINI_API_KEY

          envFrom:
            - configMapRef:
                name: mealops-config

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
