apiVersion: v1
kind: Service

metadata:
  name: mealops
  labels:
    app.kubernetes.io/name: mealops
    app.kubernetes.io/component: application

spec:
  type: LoadBalancer

  selector:
    app.kubernetes.io/name: mealops

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
